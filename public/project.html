<!DOCTYPE html>
<html class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Projects</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <link rel="stylesheet" href="../dist/css/style.css">
    <link rel="stylesheet" href="../dist/js/script.css">
</head>
<body x-data="setVisible" :class="popUp && 'overflow-hidden'" class="p-0 m-0 max-h-screen flex flex-col bg-primary selection:bg-dark dark:selection:bg-primary dark:selection:text-dark selection:text-primary dark:bg-dark font-poppins transition ease-in-out duration-500">
    <header data-aos="fade-down" data-aos-duration="1000" data-aos-delay="200" class="nav__container" >
        <nav x-data="navbar" class="flex size-full justify-between items-center">
            <h1 class="text-xl mr-10 md:text-2xl lg:text-4xl mx-2 my-3 font-bold"><a href="."><span class="scale-50"><</span>W<span>h</span><span>y</span><span class="scale-75">></span></a></h1>
            <ul :class="navOn ? 'mb-0' : 'mb-[2000rem]'" class="md:h-full flex transition-all duration-1000 ease-in-out text-2xl md:mb-0 h-[200rem] md:w-auto w-full left-0 md:left-auto md:flex-row flex-col mt-[20rem] md:mt-0 justify-center md:justify-around items-center bg-primary backdrop-blur-xl bg-opacity-60 dark:backdrop-blur-xl dark:md:backdrop-blur-none dark:md:bg-opacity-100 dark:bg-opacity-60 absolute md:backdrop-blur-none md:bg-opacity-100 dark:text-white z-[7000] md:bg-transparent md:dark:bg-transparent dark:bg-dark text-dark md:flex rounded-lg md:static">
                <div @click="navOn = ! navOn" class="md:hidden w-full pt-[20rem] relative">
                    <button class="absolute ml-5 right-2 bottom-0 hover:rotate-180 transition-all ease-in-out duration-700"><img class="size-[50px]" :src="!$store.darkMode.dark ? '../dist/img/close-light.svg' : '../dist/img/close-dark.svg'"></button>
                </div>
                <img id="nav-person-ico" class="pt-10 w-40 md:hidden rounded-full" src="https://blush.design/api/download?shareUri=wEiSOuKG_50B5sWv&c=Skin_0%7Eedb98a&bg=ffb2c9&w=800&h=800&fm=png">
                <template x-for="(path, index) of projectNav" :key="index">
                    <li class="nav__list" @click="navOn = ! navOn"><a :href="path.url" x-text="path.title"></a></li>
                </template>
            </ul>
            </div>
            <div class="flex" x-html="toggle"></div>
        </nav>
    </header>
    <main x-data="main">
        <section id="hero" class="mx-auto size-auto drop-shadow-xl pb-6 flex flex-wrap relative h-auto lg:pb-36 lg:pt-20 bg-nav bg-opacity-75 backdrop-blur-lg dark:bg-gradient-to-tl dark:from-deepSea dark:via-darkCard dark:to-primary">
            <div class="container z-10 mx-auto flex justify-center items-center flex-wrap">
                <div class="flex lg:flex-nowrap flex-wrap">
                    <img data-aos="zoom-in" data-aos-duration="1000" data-aos-delay="500" id="hero-img" class="md:mx-auto mt-12 mx-auto w-60 md:w-96" src="../dist/img/hero-img.svg" alt="person-svgImg">
                    <div id="hero-title" class="flex flex-wrap justify-center">
                        <h1 data-aos="zoom-in" data-aos-duration="1000" data-aos-delay="700" class="text-xl font-bold mx-auto text-center lg:mt-40 mb-2 sm:mb-4 text-dark dark:text-primary lg:text-5xl">Welcome to The Projects section</h1>
                        <h2 data-aos="zoom-in" data-aos-duration="20000" data-aos-delay="1000" class="text-sm font-semibold text-center md:text-base lg:text-lg text-dark dark:text-primary mb-2 sm:mb-4 lg:mb-10">Live is a Code, Break Down Complexities, Find the Patterns, and Build Solutions.</h2>
                        <a href="#content" data-aos="zoom-in" data-aos-delay="1000" data-aos-duration="1000" class="primary__button mx-[6.2rem] px-4 mb-11 sm:mt-2 sm:mx-[10.5rem] lg:mx-[17rem] xl:mx-[23rem] lg:mb-28">View &raquo;</a>
                    </div>
                </div>
            </div>
        </section>
        <section id="content" class="max-w-full relative container mx-auto mt-14 lg:mt-32 pt-5" x-data="project">
            <h1 class="text-center text-dark text-2xl md:text-3xl lg:text-5xl font-bold py-3 dark:text-primary">Project Portfolio</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="(item, index) of paginatedPage" :key="index">
                    <div data-aos="fade-right" class="card-project tr-3d bg-second dark:bg-dark text-dark drop-shadow-xl dark:drop-shadow-xl dark:shadow-primary shadow-md rounded-2xl overflow-hidden m-4 relative">
                        <template x-if="item.poster">
                            <img class="card-components mx-auto brightness-125 z-50 hover:scale-110 duration-[800ms] cursor-zoom-in transition ease-in-out h-40 w-full object-cover object-center" :src="item.poster" alt="image">
                        </template>
                        <template x-if="!item.poster">
                            <img class="card-components mx-auto brightness-125 z-50 hover:scale-110 duration-[800ms] cursor-zoom-in transition ease-in-out h-40 w-full object-cover object-center" src="../dist/img/no-image.svg" alt="no-image">
                        </template>
                        <div class="px-7 py-6 card-components tr-3d card-project">
                            <h4 class="md:mt-2 z-[66] lg:font-extrabold font-bold text-dark dark:text-primary text-xl lg:text-2xl" x-text="item.title">Title</h4>
                            <h5 class="dark:bg-dark dark:hover:bg-darkCard dark:text-primary md:mt-2 z-[9999] card-components border rounded-xl p-3 dark:bg-opacity-70 dark:backdrop-blur-lg hover:bg-second bg-primary transition ease-in-out duration-1000 font-semibold text-base lg:text-lg">Tech Stack : <span class="flex my-2"><template x-for="icons of item.icon"><span class="size-[1.5rem] bg-gradient-to-tl from-dark via-darkCard to-second  border rounded-full p-1 hover:scale-110 scale-150 transition duration-500 ease-in-out"><img class="rounded-full" :src="icons"></span></template></span></h5>
                            <p class="md:mt-7 z-[66] border dark:bg-dark dark:hover:bg-darkCard dark:text-primary rounded-xl p-3 dark:bg-opacity-70 dark:backdrop-blur-lg hover:bg-second bg-primary transition ease-in-out cursor-default duration-1000 text-sm lg:text-base mt-4 text-justify" x-text="item.desc">No Descriptions</p>
                            <div class="size-10"></div>
                        </div>
                        <div class="absolute tr-3d card-project z-40 bottom-0 right-0 float-end p-3 mx-2 my-3" x-data="{ demoBtn: false, repoBtn: false }">
                            <span class="flex card-components">
                                <template x-if="item.demo">
                                    <a class="flex group  hover:contrast-200" @mouseenter="demoBtn = ! demoBtn" @mouseleave="demoBtn = ! demoBtn" :href="item.demo">
                                        <img class="border rounded-full bg-gradient-to-tl from-dark via-darkCard to-second  p-1 size-7 group-hover:scale-150 scale-125 duration-500 ease-in-out cursor-pointer z-10" src="https://img.icons8.com/?size=100&id=63807&format=png&color=000000" alt="demo">
                                        <span x-show="demoBtn" class="dark:bg-second dark:text-dark text-sm transition duration-100 pt-1 px-4 bg-dark  scale-x-125 text-slate-50 font-bold rounded-xl" x-transition.duration.500ms>Demo</span>
                                    </a>
                                </template>
                                <template x-if="item.repo">
                                    <a class="flex group  hover:contrast-200" @mouseenter="repoBtn = ! repoBtn" @mouseleave="repoBtn = ! repoBtn" :href="item.repo">
                                        <img class="border bg-gradient-to-tl from-dark via-darkCard to-second rounded-full  p-1 size-7 group-hover:scale-150 scale-125 duration-500 ease-in-out cursor-pointer z-20" src="../dist/img/github-ico.svg" alt="gitHub">
                                        <span x-show="repoBtn" class="dark:bg-primary dark:text-dark text-sm transition duration-100 pt-1 px-4 scale-x-125 text-slate-50 bg-dark font-bold rounded-xl" x-transition.duration.200ms>Repository</span>
                                    </a>
                                </template>
                            </span>
                        </div>
                    </div>
                </template>
            </div>
            <div data-aos="fade-right" class="flex justify-center mt-6 mb-7">
                <button :class="currentPage === 1 && 'invisible'" class="shadow-dark dark:drop-shadow-lg dark:shadow-nav border px-2 md:px-4 md:py-2 m-1 rounded-md shadow-md dark:bg-dark dark:text-primary bg-second text-primabg-primary" @click="prevPage()" :disabled="currentPage === 1">&laquo;</button>
                <template x-for="num of totalPage" > 
                    <button :class="num === currentPage ? 'bg-blue-500 text-primary dark:bg-darkCard dark:text-primary' : 'bg-second dark:bg-dark dark:text-primary'" class="shadow-dark dark:drop-shadow-lgshadow-xl dark:shadow-nav border px-2 md:px-4 md:py-2 m-1 rounded-md shadow-md text-dark" @click="setPage(num)"><span x-text="num">1</span></button>
                </template>
                <button :class="currentPage == totalPage && 'invisible'" class="shadow-dark dark:drop-shadow-lg dark:shadow-nav dark:bg-dark dark:text-primary border px-2 md:px-4 md:py-2 m-1 rounded-md shadow-md bg-second text-primabg-primary" @click="nextPage()" :disabled="currentPage == totalPage">&raquo;</button>
                
            </div>
        </section>
        <section data-aos="zoom-in" id="quick-contact" class="h-full lg:h-96 my-3 py-8 container size-full max-w-full dark:bg-gradient-to-tl dark:from-deepSea dark:via-darkCard dark:to-primary bg-nav rounded-xl bg-opacity-70 backdrop-blur-lg" x-html="quickContact">
        </section>
    </main>
    <div x-data="popUpComponent">
        <div id="alert-contain" x-data="msg" x-html="messagePopUp"></div>
    </div>
    <footer x-data="footer" class="mt-auto container size-full max-w-full bg-nav dark:bg-dark dark:border rounded-xl bg-opacity-70 backdrop-blur-lg">
        <div class="h-full w-auto flex flex-wrap justify-around py-9 text-sm md:text-base text-dark dark:text-primary">
            <h1 class="md:font-medium lg:font-semibold">&copy; 2024 M Wahyudi HD</h1>
            <ul id="contact" class="flex">
                <template x-for="list of link">
                    <li class="mx-1 md:mx-3">
                        <a :href="list.url" class="group relative">
                            <div class="fill__container">
                                <div class="group-hover:scale-y-100 fill__item"></div>
                            </div>
                            <tag x-html="list.svg"></tag>
                        </a>
                    </li>
                </template>
            </ul>
        </div>
    </footer>
    
    <script src="../dist/js/script.js"></script>
</body>
</html>
